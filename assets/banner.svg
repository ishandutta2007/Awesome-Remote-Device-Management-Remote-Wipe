<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background:#0a0f1d; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    .pulse-circle { animation: pulse 3s ease-in-out infinite alternate; }
    .scan-wave { animation: scan 6s linear infinite; }
    .radar-sweep { animation: sweep 8s linear infinite; transform-origin: 1040px 170px; }
    .badge-float { animation: floatSlow 4s ease-in-out infinite alternate; }
    .packet { animation: flow 4s ease-in-out infinite; }
    
    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.65; transform: scale(1.02); }
    }
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateY(350px); opacity: 0; }
    }
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-7px); }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="340" fill="url(#bgGlow)" />

  <!-- Technical Grid Background -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="80" y1="0" x2="80" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="560" y1="0" x2="560" y2="340" />
    <line x1="720" y1="0" x2="720" y2="340" />
    <line x1="880" y1="0" x2="880" y2="340" />
    <line x1="1040" y1="0" x2="1040" y2="340" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1040" cy="170" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="950" cy="270" r="100" fill="#f43f5e" opacity="0.1" filter="url(#glow)" />

  <!-- Animated Radar / Fleet Signal on the Right side -->
  <g opacity="0.85">
    <circle cx="1040" cy="170" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1040" cy="170" r="75" fill="none" stroke="#475569" stroke-width="1.5" />
    <circle cx="1040" cy="170" r="40" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 4" />
    <circle cx="1040" cy="170" r="6" fill="#38bdf8" filter="url(#glow)" />

    <!-- Radar Sweep Needle -->
    <g class="radar-sweep">
      <line x1="1040" y1="170" x2="1040" y2="60" stroke="url(#accentCyan)" stroke-width="2.5" opacity="0.8" />
      <polygon points="1040,170 1020,70 1040,60" fill="url(#accentCyan)" opacity="0.15" />
    </g>

    <!-- Floating Target Fleet Devices -->
    <circle cx="990" cy="120" r="4" fill="#10b981" filter="url(#glow)" />
    <text x="985" y="110" fill="#94a3b8" font-size="9" font-family="monospace">macOS</text>

    <circle cx="1090" cy="140" r="4" fill="#38bdf8" filter="url(#glow)" />
    <text x="1085" y="130" fill="#94a3b8" font-size="9" font-family="monospace">Win11</text>

    <circle cx="1020" cy="230" r="4" fill="#f59e0b" filter="url(#glow)" />
    <text x="1015" y="245" fill="#94a3b8" font-size="9" font-family="monospace">Android</text>

    <circle cx="1110" cy="220" r="4" fill="#f43f5e" filter="url(#glow)" />
    <text x="1105" y="235" fill="#f43f5e" font-size="9" font-family="monospace">WIPE_SENT</text>

    <!-- Animated Data Flow / Packet line -->
    <path d="M 1040 170 L 1110 220" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 6" fill="none" style="animation: flow 1.5s linear infinite;" />
  </g>

  <!-- Foreground Content: Pill Badges -->
  <g class="badge-float" transform="translate(70, 48)">
    <!-- Pill 1: Status -->
    <rect x="0" y="0" width="136" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="14" cy="14" r="4" fill="#10b981" filter="url(#glow)" />
    <text x="26" y="18" fill="#38bdf8" font-size="11.5" font-weight="600" letter-spacing="0.5">UEM / MDM FLEET</text>

    <!-- Pill 2: Security Action -->
    <rect x="148" y="0" width="156" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" opacity="0.9" />
    <circle cx="162" cy="14" r="4" fill="#f43f5e" filter="url(#glow)" />
    <text x="174" y="18" fill="#fda4af" font-size="11.5" font-weight="600" letter-spacing="0.5">ZERO-TRUST REMOTE WIPE</text>
  </g>

  <!-- Main Headline Title (Foreground, Sharp, High Contrast) -->
  <text x="70" y="132" font-size="36" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Awesome Remote Device Management
  </text>
  <text x="70" y="176" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    &amp; Remote Wipe Solutions 🛡️
  </text>

  <!-- Subtitle / Meta Description -->
  <text x="70" y="214" font-size="14.5" fill="#94a3b8" font-weight="400">
    Curated enterprise commercial UEM/MDM suites &amp; open-source endpoint fleet controllers.
  </text>
  <text x="70" y="235" font-size="13" fill="#64748b" font-weight="400">
    Factory reset, selective corporate sanitization, crypto-erasure, and distributed security telemetry.
  </text>

  <!-- Tech Highlights Bar at Bottom -->
  <g transform="translate(70, 270)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="145" height="38" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="14" y="16" fill="#38bdf8" font-size="10.5" font-weight="700">OS ECOSYSTEM</text>
    <text x="14" y="29" fill="#cbd5e1" font-size="11">Windows • macOS • Linux</text>

    <!-- Card 2 -->
    <rect x="157" y="0" width="145" height="38" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="171" y="16" fill="#818cf8" font-size="10.5" font-weight="700">MOBILE ECOSYSTEM</text>
    <text x="171" y="29" fill="#cbd5e1" font-size="11">Android Ent. • iOS / iPad</text>

    <!-- Card 3 -->
    <rect x="314" y="0" width="150" height="38" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="328" y="16" fill="#f43f5e" font-size="10.5" font-weight="700">WIPE GRANULARITY</text>
    <text x="328" y="29" fill="#cbd5e1" font-size="11">Full Reset • Corporate • Offline</text>

    <!-- Card 4 -->
    <rect x="476" y="0" width="140" height="38" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="490" y="16" fill="#34d399" font-size="10.5" font-weight="700">DEPLOYMENT</text>
    <text x="490" y="29" fill="#cbd5e1" font-size="11">Cloud SaaS &amp; Self-Hosted</text>
  </g>
</svg>
